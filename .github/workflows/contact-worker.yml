# Triển khai Worker form liên hệ `gms-contact` lên Cloudflare (giống workflow Cloudflare của www.bongmedia.vn).
# - Push main có đổi worker/, contracts/, wrangler.api.jsonc, package.json, bun.lock ⇒ tự triển khai.
# - Chạy tay (Run workflow) bất cứ lúc nào, vd sau khi thêm/đổi secret.
# Secret cần ở GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID      — token quyền Workers Scripts Edit + D1 Edit (+ Account Settings Read)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS      — hộp thư gửi marketing@bongmedia.vn (Zoho), như bongmedia.vn
#   TURNSTILE_SECRET                                 — Secret key của widget Turnstile cho gms.bongmedia.vn
#   GMS_PROXY_SECRET                                 — cùng giá trị với biến GMS_PROXY_SECRET của project Vercel `gms`
#   IP_HMAC_KEY (tuỳ chọn)                           — thiếu thì workflow tự sinh một lần và giữ trong Worker
name: Contact Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'contracts/**'
      - 'wrangler.api.jsonc'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/contact-worker.yml'
  workflow_dispatch: {}

concurrency:
  group: contact-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Kiểm tra token Cloudflare
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Thiếu secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Thiếu secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Cài thư viện
        run: bun install --frozen-lockfile
      - name: Test Worker
        run: bun x vitest run worker
      - name: Triển khai Worker
        run: bun x wrangler deploy --config wrangler.api.jsonc
      - name: Secret của Worker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          PROXY_SECRET: ${{ secrets.GMS_PROXY_SECRET }}
          IP_HMAC_KEY: ${{ secrets.IP_HMAC_KEY }}
        run: |
          EXISTING=$(bun x wrangler secret list --config wrangler.api.jsonc --format json 2>/dev/null || echo '[]')
          node -e '
            let list = [];
            try { list = JSON.parse(process.argv[1] || "[]"); } catch {}
            const have = new Set((Array.isArray(list) ? list : []).map((s) => s.name));
            const keys = ["SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASS", "TURNSTILE_SECRET", "PROXY_SECRET", "IP_HMAC_KEY"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            if (!out.IP_HMAC_KEY && !have.has("IP_HMAC_KEY")) out.IP_HMAC_KEY = require("crypto").randomBytes(32).toString("hex");
            const missing = ["SMTP_HOST", "SMTP_USER", "SMTP_PASS", "TURNSTILE_SECRET", "PROXY_SECRET"].filter((k) => !out[k] && !have.has(k));
            if (missing.length) console.log("::warning::Chưa có secret: " + missing.join(", ") + " — form sẽ chưa gửi được thư.");
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Đặt " + Object.keys(out).length + " secret: " + Object.keys(out).join(", "));
          ' "$EXISTING"
          if [ "$(cat secrets.json)" != "{}" ]; then bun x wrangler secret bulk secrets.json --config wrangler.api.jsonc; fi
          rm -f secrets.json
      - name: Địa chỉ Worker và kiểm tra sức khoẻ
        env:
          PROXY_SECRET: ${{ secrets.GMS_PROXY_SECRET }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result?.subdomain||'')}catch{console.log('')}})")
          if [ -z "$SUB" ]; then echo "::warning::Tài khoản chưa có tên miền phụ workers.dev"; exit 0; fi
          URL="https://gms-contact.$SUB.workers.dev"
          echo "GMS_API_ORIGIN cho Vercel: $URL"
          echo "### GMS_API_ORIGIN = \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          sleep 5
          curl -s -H "x-gms-proxy: $PROXY_SECRET" "$URL/api/contact/health" | head -c 400; echo
